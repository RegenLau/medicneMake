<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布局模板提案 · 第 3 版</title>
<style>
  :root {
    --page-bg: #f3f6f8; --page-ink: #17262f; --page-soft: #5b6b75; --page-line: #dfe6ea; --page-accent: #157a7f;
    --cn: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink); font-family: var(--cn); }
  .page { max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; }
  .page h1 { font-size: 26px; margin: 0 0 6px; }
  .page > p { margin: 0 0 12px; color: var(--page-soft); line-height: 1.7; max-width: 900px; }
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; background: var(--page-bg); }
  .toolbar > span { color: var(--page-soft); font-size: 14px; margin-right: 4px; }
  .toolbar button { font: inherit; font-size: 14px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1px solid var(--page-line); background: #fff; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .toolbar button i { width: 22px; height: 22px; border-radius: 50%; background: var(--sw); background-size: cover; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .toolbar button[aria-pressed="true"] { border-color: var(--page-accent); color: var(--page-accent); background: #e9f5f5; font-weight: 600; }
  .theme-note { font-size: 13px; color: var(--page-soft); margin: 2px 0 0; min-height: 20px; }
  .layout { background: #fff; border: 1px solid var(--page-line); border-radius: 16px; padding: 22px; margin-top: 22px; }
  .layout header { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 16px; }
  .layout header .num { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--page-accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .layout h2 { margin: 2px 0 4px; font-size: 20px; }
  .layout h2 small { color: var(--page-soft); font-weight: 400; font-size: 14px; }
  .layout header p { margin: 0; color: var(--page-soft); line-height: 1.6; font-size: 14px; }
  .layout header p.changed { margin-top: 6px; color: #8a5a12; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 20px; align-items: start; }
  .stage { width: 100%; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px var(--page-line); }
  .stage > .f { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .notes { font-size: 13px; line-height: 1.65; color: var(--page-soft); }
  .notes h3 { font-size: 13px; color: var(--page-ink); margin: 14px 0 4px; }
  .notes h3:first-child { margin-top: 0; }
  .notes ul { margin: 0; padding-left: 18px; }
  .schema { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #eef6f6; border-radius: 8px; overflow: hidden; }
  .schema div { position: absolute; display: grid; place-items: center; font-size: 11px; line-height: 1.1; text-align: center; color: #355; background: #d4ebeb; border-radius: 3px; outline: 1px solid #fff; }
  .schema div.media { background: #a9d8db; }

  /* ===== 视频画面（1280×720）。颜色、背景、卡片质感全部来自主题变量 ===== */
  .f { width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: var(--cn); color: var(--v-ink); background: var(--v-bg); }
  body[data-theme="medical"] .f {
    --v-bg: linear-gradient(155deg, #f2f8ff 0%, #e4f0fc 54%, #eef6fe 100%);
    --v-ink: #122d4c; --v-ink-soft: #44607d; --v-primary: #1466cc; --v-primary-deep: #0d4fa3; --v-primary-soft: #dfeeff;
    --v-coral: #e6592d; --v-coral-soft: #fff1ec; --v-amber: #d98218; --v-amber-soft: #fff6e8; --v-green: #1e8e5a; --v-green-soft: #eaf8f0;
    --v-card-bg: #ffffff; --v-card-border: #d2e4f6; --v-card-border-w: 1px; --v-card-shadow: 0 12px 28px rgba(0,0,0,.08); --v-card-radius: 22px; --v-card-blur: none;
    --v-ring-outer: #e67835; --v-sub-hl: #ffe14d; --v-band: #0f2a4a; --v-band-ink: #fff;
    --v-rail-bg: #ffffff; --v-rail-ink: #122d4c; --v-rail-line: #d2e4f6;
  }
  body[data-theme="warm"] .f {
    --v-bg: #fdf5e7;
    --v-ink: #263544; --v-ink-soft: #59636d; --v-primary: #cf5228; --v-primary-deep: #a83c18; --v-primary-soft: #fceae1;
    --v-coral: #cf5228; --v-coral-soft: #fdebe4; --v-amber: #d68a27; --v-amber-soft: #fef4df; --v-green: #5c9145; --v-green-soft: #eef6e8;
    --v-card-bg: #fffdf9; --v-card-border: #2c3e50; --v-card-border-w: 2px; --v-card-shadow: 0 10px 24px rgba(0,0,0,.08); --v-card-radius: 18px; --v-card-blur: none;
    --v-ring-outer: #2c3e50; --v-sub-hl: #ffe14d; --v-band: #2c3e50; --v-band-ink: #fff;
    --v-rail-bg: #f6e6cc; --v-rail-ink: #263544; --v-rail-line: rgba(44,62,80,.18);
  }
  body[data-theme="mint"] .f {
    --v-bg: linear-gradient(160deg, #f1f9f5 0%, #e3f3ec 60%, #f4faf7 100%);
    --v-ink: #1b3a34; --v-ink-soft: #4d6b64; --v-primary: #1c8a72; --v-primary-deep: #116553; --v-primary-soft: #dcf1e9;
    --v-coral: #e2674f; --v-coral-soft: #fdeeea; --v-amber: #cf8a22; --v-amber-soft: #fdf3e2; --v-green: #2f9a5d; --v-green-soft: #e6f6ec;
    --v-card-bg: #ffffff; --v-card-border: #cfe7dd; --v-card-border-w: 1px; --v-card-shadow: 0 12px 28px rgba(16,70,58,.08); --v-card-radius: 24px; --v-card-blur: none;
    --v-ring-outer: #e2674f; --v-sub-hl: #ffe680; --v-band: #1b3a34; --v-band-ink: #fff;
    --v-rail-bg: #d9efe6; --v-rail-ink: #1b3a34; --v-rail-line: rgba(27,58,52,.14);
  }
  body[data-theme="night"] .f {
    --v-bg: radial-gradient(120% 90% at 85% 0%, #1d3a4c 0%, #12212c 55%, #0d1820 100%);
    --v-ink: #eef4f7; --v-ink-soft: #a9bcc7; --v-primary: #4fb8c4; --v-primary-deep: #8ad6de; --v-primary-soft: rgba(79,184,196,.16);
    --v-coral: #ff8a6b; --v-coral-soft: rgba(255,138,107,.14); --v-amber: #f4b75c; --v-amber-soft: rgba(244,183,92,.14); --v-green: #5fcf92; --v-green-soft: rgba(95,207,146,.14);
    --v-card-bg: #182c38; --v-card-border: #2a4553; --v-card-border-w: 1px; --v-card-shadow: 0 16px 34px rgba(0,0,0,.35); --v-card-radius: 20px; --v-card-blur: none;
    --v-ring-outer: #4fb8c4; --v-sub-hl: #ffd75e; --v-band: #07121a; --v-band-ink: #fff;
    --v-rail-bg: #0f1d26; --v-rail-ink: #eef4f7; --v-rail-line: #2a4553;
  }
  body[data-theme="illus"] .f {
    --v-bg: center / cover no-repeat url("assets/bg-illustration.jpg");
    --v-ink: #2f3d36; --v-ink-soft: #64736a; --v-primary: #4c7d61; --v-primary-deep: #36604a; --v-primary-soft: #e3eedf;
    --v-coral: #d46e4d; --v-coral-soft: #fbe9e1; --v-amber: #c98a35; --v-amber-soft: #fbf1df; --v-green: #4c8a5c; --v-green-soft: #e6f1e3;
    --v-card-bg: rgba(255,253,248,.94); --v-card-border: rgba(76,125,97,.22); --v-card-border-w: 1px; --v-card-shadow: 0 14px 30px rgba(73,90,70,.12); --v-card-radius: 26px; --v-card-blur: none;
    --v-ring-outer: #d46e4d; --v-sub-hl: #ffe08a; --v-band: #3d5a4a; --v-band-ink: #fff;
    --v-rail-bg: rgba(255,253,248,.78); --v-rail-ink: #2f3d36; --v-rail-line: rgba(76,125,97,.2);
  }
  body[data-theme="photo"] .f {
    --v-bg: center / cover no-repeat url("assets/bg-clinic-blur.jpg");
    --v-ink: #15303a; --v-ink-soft: #4b6570; --v-primary: #127c86; --v-primary-deep: #0b5c64; --v-primary-soft: rgba(18,124,134,.12);
    --v-coral: #e0603f; --v-coral-soft: rgba(224,96,63,.12); --v-amber: #c7821e; --v-amber-soft: rgba(199,130,30,.12); --v-green: #23885a; --v-green-soft: rgba(35,136,90,.12);
    --v-card-bg: rgba(255,255,255,.80); --v-card-border: rgba(255,255,255,.9); --v-card-border-w: 1px; --v-card-shadow: 0 18px 40px rgba(20,48,58,.16); --v-card-radius: 24px; --v-card-blur: blur(14px) saturate(1.2);
    --v-ring-outer: #ffffff; --v-sub-hl: #ffe14d; --v-band: rgba(13,38,48,.86); --v-band-ink: #fff;
    --v-rail-bg: rgba(255,255,255,.66); --v-rail-ink: #15303a; --v-rail-line: rgba(21,48,58,.12);
  }
  .abs { position: absolute; }
  .card { background: var(--v-card-bg); border: var(--v-card-border-w) solid var(--v-card-border); border-radius: var(--v-card-radius); box-shadow: var(--v-card-shadow); backdrop-filter: var(--v-card-blur); -webkit-backdrop-filter: var(--v-card-blur); }
  .avatar { border-radius: 50%; background: center 18% / cover no-repeat url("../public/assets/template-doctor-digital.jpg"); }
  body[data-theme="warm"] .avatar, body[data-theme="illus"] .avatar { background-image: url("../public/assets/template-doctor-cartoon.jpg"); }
  .hl { color: var(--v-sub-hl); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .sub-band { display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; letter-spacing: 1px; color: var(--v-band-ink); }
  .sub-band > span { background: var(--v-band); padding: 10px 30px; border-radius: 16px; }

  /* --- 内容区示意（实际由制作方式渲染） --- */
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 26px 30px; }
  .content h4 { margin: 0 0 18px; font-size: 30px; text-align: center; }
  .content h4 small { display: block; margin-top: 6px; font-size: 16px; font-weight: 500; color: var(--v-ink-soft); }
  /* 时间轴：节点与标签都以「中心点」定位在同一条轴上；轴线两端就是首末节点的中心；每段轴线正下方对应同色卡片 */
  .tl { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 20px 24px; }
  .tl .track { grid-column: 1 / -1; position: relative; height: 92px; margin: 0 56px; }
  .tl .seg { position: absolute; top: 66px; height: 6px; transform: translateY(-50%); }
  .tl .seg.ok { left: 0; width: 50%; background: var(--v-green); }
  .tl .seg.no { left: 50%; width: 50%; background: var(--v-coral); }
  .tl .node { position: absolute; top: 66px; width: 28px; height: 28px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--v-card-bg); border: 5px solid var(--v-ink); }
  .tl .node.mid { border-color: var(--v-amber); }
  .tl .lbl { position: absolute; top: 0; transform: translateX(-50%); text-align: center; white-space: nowrap; font-size: 15px; line-height: 20px; color: var(--v-ink-soft); }
  .tl .lbl b { display: block; font-size: 19px; line-height: 24px; color: var(--v-ink); font-variant-numeric: tabular-nums; }
  .opt { border-radius: 18px; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 6px solid; }
  .opt .tag { font-size: 16px; font-weight: 700; }
  .opt strong { display: block; font-size: 32px; line-height: 1.2; }
  .opt p { margin: 0; font-size: 19px; color: var(--v-ink-soft); line-height: 1.5; }
  .opt.ok { border-color: var(--v-green); } .opt.no { border-color: var(--v-coral); }
  .opt.ok { background: var(--v-green-soft); } .opt.ok .tag { color: var(--v-green); }
  .opt.no { background: var(--v-coral-soft); } .opt.no .tag { color: var(--v-coral); }
  .steps { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .step { border-radius: 18px; background: var(--v-primary-soft); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .step .n { width: 40px; height: 40px; border-radius: 12px; background: var(--v-primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
  .step strong { font-size: 24px; } .step p { margin: 0; font-size: 17px; color: var(--v-ink-soft); line-height: 1.5; }
  .step.dim { opacity: .45; } .step.on { outline: 3px solid var(--v-primary); background: var(--v-card-bg); }
  .vs { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .vs > div { border-radius: 18px; padding: 20px 22px; }
  .vs .no { background: var(--v-coral-soft); } .vs .ok { background: var(--v-green-soft); }
  .vs .label { font-size: 18px; font-weight: 800; } .vs .no .label { color: var(--v-coral); } .vs .ok .label { color: var(--v-green); }
  .vs strong { display: block; font-size: 28px; margin: 12px 0 10px; line-height: 1.35; }
  .vs ul { margin: 0; padding-left: 22px; font-size: 19px; line-height: 1.75; color: var(--v-ink-soft); }
  .checks { flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .checks div { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 16px; background: var(--v-primary-soft); font-size: 24px; font-weight: 600; }
  .checks i { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: #fff; background: var(--v-green); font-size: 20px; }
  .checks div.todo { background: transparent; border: 2px dashed var(--v-card-border); color: var(--v-ink-soft); }
  .checks div.todo i { background: var(--v-ink-soft); opacity: .5; }

  /* ===== 1 章节导航：浅色导航栏 ===== */
  .L1 .rail { left: 24px; top: 24px; width: 264px; height: 672px; padding: 26px 20px; display: flex; flex-direction: column; color: var(--v-rail-ink);
    background: var(--v-rail-bg); border-radius: var(--v-card-radius); box-shadow: var(--v-card-shadow); border: var(--v-card-border-w) solid var(--v-card-border); backdrop-filter: var(--v-card-blur); -webkit-backdrop-filter: var(--v-card-blur); }
  .L1 .rail .kick { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--v-primary); }
  .L1 .rail .topic { font-size: 25px; font-weight: 800; line-height: 1.35; margin-top: 8px; }
  .L1 .rail .meta { margin-top: 6px; font-size: 14px; color: var(--v-ink-soft); }
  .L1 .chaps { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--v-rail-line); display: flex; flex-direction: column; gap: 4px; position: relative; }
  .L1 .chap { display: flex; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 14px; font-size: 18px; color: var(--v-ink-soft); }
  .L1 .chap b { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px solid var(--v-rail-line); display: grid; place-items: center; font-size: 14px; background: var(--v-card-bg); }
  .L1 .chap.done { color: var(--v-ink); } .L1 .chap.done b { background: var(--v-green); border-color: var(--v-green); color: #fff; }
  .L1 .chap.on { background: var(--v-primary); color: #fff; font-weight: 700; flex-wrap: wrap; }
  .L1 .chap.on b { background: #fff; color: var(--v-primary); border-color: #fff; }
  .L1 .chap .bar { flex-basis: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); margin: 2px 0 2px 42px; position: relative; }
  .L1 .chap .bar::after { content: ""; position: absolute; inset: 0 55% 0 0; border-radius: 3px; background: #fff; }
  .L1 .who { margin-top: auto; display: flex; gap: 12px; align-items: center; padding-top: 16px; border-top: 1px solid var(--v-rail-line); }
  .L1 .who .avatar { width: 60px; height: 60px; flex: none; box-shadow: 0 0 0 3px var(--v-ring-outer); }
  .L1 .who strong { font-size: 18px; display: block; } .L1 .who span { font-size: 13px; color: var(--v-ink-soft); }
  .L1 .disc { margin-top: 10px; font-size: 12px; color: var(--v-ink-soft); }
  .L1 .crumb { left: 312px; top: 26px; font-size: 18px; color: var(--v-ink-soft); }
  .L1 .crumb b { color: var(--v-primary); }
  .L1 .clock { right: 32px; top: 26px; font-size: 16px; color: var(--v-ink-soft); font-variant-numeric: tabular-nums; }
  .L1 .media { left: 312px; top: 64px; width: 944px; height: 512px; overflow: hidden; }
  .L1 .sub { left: 312px; top: 596px; width: 944px; height: 100px; }
  .L1 .sub > span { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: var(--v-card-radius); }

  /* ===== 2 播报横条：信息条 + 满宽内容 + 对齐的主讲横条 ===== */
  .L2 .ticker { left: 0; top: 0; width: 1280px; height: 56px; padding: 0 40px; display: flex; align-items: center; gap: 14px; font-size: 17px;
    background: var(--v-card-bg); border-bottom: var(--v-card-border-w) solid var(--v-card-border); backdrop-filter: var(--v-card-blur); -webkit-backdrop-filter: var(--v-card-blur); }
  .L2 .ticker .pill { background: var(--v-coral); color: #fff; }
  .L2 .ticker strong { font-size: 19px; }
  .L2 .ticker .sep { width: 1px; height: 22px; background: var(--v-card-border); margin: 0 6px; }
  .L2 .ticker small { color: var(--v-ink-soft); font-size: 15px; }
  .L2 .ticker .tag { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--v-primary-soft); color: var(--v-primary-deep); }
  .L2 .ticker .count { margin-left: auto; color: var(--v-ink-soft); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .L2 .media { left: 0; top: 56px; width: 1280px; height: 504px; overflow: hidden; background: var(--v-card-bg); backdrop-filter: var(--v-card-blur); -webkit-backdrop-filter: var(--v-card-blur); }
  .L2 .full { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .L2 .full > div { position: relative; padding: 30px 48px 26px; display: flex; flex-direction: column; }
  .L2 .full .a { background: var(--v-coral-soft); } .L2 .full .b { background: var(--v-green-soft); }
  .L2 .full .vsb { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: var(--v-card-bg); display: grid; place-items: center; font-weight: 900; font-size: 22px; color: var(--v-ink); box-shadow: var(--v-card-shadow); z-index: 1; }
  .L2 .full .label { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
  .L2 .full .a .label { color: var(--v-coral); } .L2 .full .b .label { color: var(--v-green); }
  .L2 .full h5 { margin: 6px 0 0; font-size: 34px; }
  .L2 .full p { margin: 6px 0 0; font-size: 19px; color: var(--v-ink-soft); }
  .L2 .full svg { margin-top: auto; width: 100%; height: 230px; }
  .L2 .prog { left: 0; top: 560px; width: 1280px; height: 5px; background: var(--v-primary-soft); }
  .L2 .prog::after { content: ""; position: absolute; inset: 0 40% 0 0; background: var(--v-primary); }
  .L2 .avatar { left: 40px; top: 586px; width: 116px; height: 116px; border: 5px solid var(--v-card-bg); box-shadow: 0 0 0 3px var(--v-ring-outer), 0 8px 20px rgba(0,0,0,.16); }
  .L2 .name { left: 176px; top: 586px; height: 34px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-radius: 10px 10px 0 0;
    background: var(--v-primary); color: #fff; font-size: 18px; font-weight: 700; }
  .L2 .name em { font-style: normal; font-weight: 400; font-size: 15px; opacity: .88; }
  .L2 .band { left: 176px; top: 620px; width: 1064px; height: 82px; border-radius: 0 16px 16px 16px; background: var(--v-band); justify-content: flex-start; padding-left: 32px; }

  /* ===== 3 名片与要点栏（保持） ===== */
  .L3 .top { left: 32px; top: 20px; width: 1216px; height: 84px; display: flex; align-items: center; gap: 16px; padding: 0 22px; }
  .L3 .top .avatar { width: 58px; height: 58px; flex: none; box-shadow: 0 0 0 3px var(--v-ring-outer); }
  .L3 .top .id strong { font-size: 20px; } .L3 .top .id span { font-size: 14px; color: var(--v-ink-soft); }
  .L3 .top .id .badge { font-size: 13px; background: var(--v-primary); color: #fff; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }

      regions: [["提问",3.1,3.9,93.8,11.7],["头像",3.1,19.4,5,8.9],["回答结论",9.4,18.3,87.5,8.9],["内容（回答内）",9.4,27.2,87.5,53.9,1],["字幕",0,83.3,100,16.7]] },
    { id: "L5", name: "大字报", en: "headline",
      lead: "杂志式排版：左侧只放一个大标题（本幕结论）和一句解释，右侧内容区，下方左对齐的大字字幕。",
      changed: "第 3 版改动：去掉关键数字块、依据出处和分隔线，整幅画面只保留一个视觉重点：大标题；强调色只用在标题关键词上。标题区在左栏垂直居中，主讲人贴齐左栏底部；字幕改为口播当前这一步，不再重复标题。",
      fits: ["结论明确、有关键数字的内容（剂量、间隔、天数）", "开场破题和结尾总结"],
      adds: ["本幕大标题（一句结论，关键词高亮）", "一句解释", "章节引导语"],
      regions: [["引导语+大标题+主讲",5,7.8,36.7,70.8],["内容",44.8,7.8,50.2,70.8,1],["字幕",5,83.3,90,11.1]] },
  ];
  const toolbar = document.querySelector(".toolbar");
  const note = document.getElementById("theme-note");
  const setTheme = (id) => {
    document.body.dataset.theme = id;
    toolbar.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === id));
    note.textContent = themes.find(t => t.id === id).note;
  };
  themes.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.theme = t.id; b.innerHTML = `<i style='--sw:${t.sw}'></i>${t.name}`;
    b.addEventListener("click", () => setTheme(t.id));
    toolbar.append(b);
  });
  const list = document.getElementById("list");
  layouts.forEach((l, i) => {
    const sec = document.createElement("section");
    sec.className = "layout";
    sec.innerHTML = `<header><div class="num">${i + 1}</div><div><h2>${l.name} <small>${l.en}</small></h2><p>${l.lead}</p>${l.changed ? `<p class="changed">${l.changed}</p>` : ""}</div></header>
      <div class="grid"><div class="stage"></div><div class="notes">
        <h3>选择器缩略图</h3><div class="schema">${l.regions.map(([n,x,y,w,h,m]) => `<div class="${m ? "media" : ""}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${n}</div>`).join("")}</div>
        <h3>适合</h3><ul>${l.fits.map(t => `<li>${t}</li>`).join("")}</ul>
        <h3>新增的信息元素</h3><ul>${l.adds.map(t => `<li>${t}</li>`).join("")}</ul>
      </div></div>`;
    sec.querySelector(".stage").append(document.getElementById(l.id).content.cloneNode(true));
    list.append(sec);
  });
  setTheme("warm");
  const fit = () => document.querySelectorAll(".stage").forEach(s => { s.firstElementChild.style.transform = `scale(${s.clientWidth / 1280})`; });
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
