<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>希息药事 · 科普视频模板设计稿</title>
<style>
  :root {
    --shell-bg: #eef2f7;
    --shell-surface: #ffffff;
    --shell-border: #dce4ef;
    --shell-text: #152538;
    --shell-muted: #5a6d82;
    --shell-accent: #1877e8;
    --shell-accent-soft: #e7f2ff;
    --focus-ring: 0 0 0 3px rgba(24, 119, 232, 0.28);
    --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  ::selection {
    background: rgba(24, 119, 232, 0.18);
    color: #0e243d;
  }

  html, body {
    height: 100%;
    font-family: var(--font-sans);
    background: var(--shell-bg);
    color: var(--shell-text);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  /* Custom scrollbars */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #c5d1df;
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #9fb2c7;
  }

  /* ===== Top Studio Bar ===== */
  .studio-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--shell-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    color: var(--shell-text);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: #1877e8;
    color: #fff;
    display: grid;
    place-items: center;
  }

  .controls-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .segmented {
    display: inline-flex;
    align-items: center;
    background: #edf2f8;
    padding: 3px;
    border-radius: 10px;
    border: 1px solid #dfe7f1;
    gap: 2px;
  }

  .seg-btn {
    border: none;
    background: transparent;
    color: #4b5e74;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    white-space: nowrap;
  }

  .seg-btn:hover {
    color: #152538;
  }

  .seg-btn:focus-visible,
  .action-btn:focus-visible,
  .film-card:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  .seg-btn.active {
    background: #ffffff;
    color: #1258b5;
    box-shadow: 0 1px 3px rgba(15, 35, 65, 0.08);
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--shell-border);
    background: #ffffff;
    color: #2c4057;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    white-space: nowrap;
  }

  .action-btn:hover {
    background: #f6f9fd;
    border-color: #bfd0e4;
  }

  .action-btn.active {
    background: #e9f3ff;
    border-color: #8bc0fa;
    color: #1258b5;
  }

  /* ===== Main Workspace ===== */
  .studio-main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  /* Single Stage View */
  .stage-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .stage-viewport {
    width: 100%;
    max-width: min(1180px, calc((100vh - 225px) * 16 / 9));
    min-width: 640px;
    aspect-ratio: 16 / 9;
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 22px 54px rgba(15, 36, 66, 0.14), 0 4px 12px rgba(15, 36, 66, 0.06);
    background: #eef6fe;
  }

  .stage-scaler {
    width: 1280px;
    height: 720px;
    transform-origin: top left;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Filmstrip selector */
  .filmstrip {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }

  .film-card {
    background: #ffffff;
    border: 1.5px solid #dce4ef;
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1), border-color 180ms ease, box-shadow 180ms ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .film-card:hover {
    transform: translateY(-2px);
    border-color: #9ec5f2;
  }

  .film-card.active {
    border-color: #1877e8;
    background: #f5faff;
    box-shadow: 0 6px 16px rgba(24, 119, 232, 0.12);
  }

  .film-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: #5b728d;
  }

  .film-card.active .film-top {
    color: #1565c8;
  }

  .film-time {
    font-size: 11px;
    font-weight: 600;
    color: #7b8fa6;
  }

  .film-title {
    font-size: 14px;
    font-weight: 700;
    color: #162a42;
  }

  .film-meta {
    font-size: 12px;
    color: #627790;
  }

  /* Overview Gallery View */
  .overview-grid {
    display: none;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    max-width: 1360px;
    margin: 0 auto;
  }

  .overview-grid.visible {
    display: grid;
  }

  .stage-wrap.hidden {
    display: none;
  }

  .overview-item {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .overview-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    font-size: 14px;
    font-weight: 700;
    color: #1b314b;
  }

  .overview-label span {
    font-size: 12px;
    font-weight: 600;
    color: #5c728c;
  }

  .overview-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(15, 36, 66, 0.1);
    border: 1px solid #d5e1ee;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 200ms ease;
  }

  .overview-frame:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 38px rgba(15, 36, 66, 0.15);
  }

  /* Spec Summary Drawer below stage */
  .spec-strip {
    width: 100%;
    max-width: 1200px;
    margin: 22px auto 0;
    background: #ffffff;
    border: 1px solid var(--shell-border);
    border-radius: 14px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .spec-col h4 {
    font-size: 13px;
    font-weight: 700;
    color: #162b44;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .spec-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .spec-col p {
    font-size: 12.5px;
    line-height: 1.55;
    color: #52677e;
  }

  /* ===================================================================
     THE 1280 x 720 VIDEO TEMPLATE CANVAS
     =================================================================== */
  .video-frame {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* ---- THEME 1: MEDICAL BLUE (对标附图2 药道病除) ---- */
  .video-frame.theme-medical {
    --v-bg: linear-gradient(155deg, #f3f9ff 0%, #e4f1fc 52%, #edf6fe 100%);
    --v-ink: #133152;
    --v-ink-soft: #436180;
    --v-primary: #1a78e6;
    --v-primary-deep: #0e59b5;
    --v-primary-soft: #e0f0ff;
    --v-coral: #e6592d;
    --v-coral-soft: #fff1ec;
    --v-amber: #d98218;
    --v-amber-soft: #fff6e8;
    --v-green: #1e8e5a;
    --v-green-soft: #eaf8f0;
    --v-card-bg: #ffffff;
    --v-card-border: #d4e6f7;
    --v-card-shadow: 0 14px 34px rgba(18, 69, 130, 0.085);
    --v-card-radius: 22px;
    --v-ring-outer: #e87a38;
    --v-ring-inner: #ffffff;
    --v-sub-hl: #66ccff;
    background: var(--v-bg);
    color: var(--v-ink);
  }

  /* Subtle background medical geometry for Medical theme */
  .video-frame.theme-medical::before {
    content: "";
    position: absolute;
    width: 540px;
    height: 540px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(133, 195, 255, 0.24) 0%, rgba(133, 195, 255, 0) 70%);
    top: -180px;
    right: -100px;
    pointer-events: none;
  }

  .video-frame.theme-medical::after {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(154, 212, 255, 0.2) 0%, rgba(154, 212, 255, 0) 72%);
    bottom: -160px;
    left: -80px;
    pointer-events: none;
  }

  /* ---- THEME 2: WARM HAND-DRAWN (对标首张暖米色手绘风) ---- */
  .video-frame.theme-warm {
    --v-bg: #fdf5e7;
    --v-ink: #273645;
    --v-ink-soft: #59636d;
    --v-primary: #d95a30;
    --v-primary-deep: #b8421c;
    --v-primary-soft: #fceae1;
    --v-coral: #d95a30;
    --v-coral-soft: #fdebe4;
    --v-amber: #d68a27;
    --v-amber-soft: #fef4df;
    --v-green: #5f9446;
    --v-green-soft: #eef6e8;
    --v-card-bg: #fffdf9;
    --v-card-border: #2c3e50;
    --v-card-shadow: 0 10px 24px rgba(58, 43, 24, 0.08);
    --v-card-radius: 18px;
    --v-ring-outer: #2c3e50;
    --v-ring-inner: #fdf5e7;
    --v-sub-hl: #ffb478;
    background: var(--v-bg);
    color: var(--v-ink);
  }

  .video-frame.theme-warm .main-card,
  .video-frame.theme-warm .left-pill,
  .video-frame.theme-warm .pharmacist-card {
    border-width: 2px;
  }

  /* ===== Zone 1: Top Header Bar ===== */
  .vf-header {
    position: relative;
    z-index: 5;
    height: 76px;
    padding: 18px 36px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .vf-topic-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 22px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--v-card-border);
    font-size: 21px;
    font-weight: 800;
    color: var(--v-ink);
    letter-spacing: -0.01em;
    box-shadow: 0 4px 14px rgba(18, 60, 110, 0.05);
  }

  .theme-warm .vf-topic-pill {
    background: #fffdf9;
    border-width: 2px;
  }

  .vf-topic-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--v-primary);
  }

  .vf-chapters {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .vf-chap {
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    color: var(--v-ink-soft);
    background: rgba(255, 255, 255, 0.58);
    border: 1px solid rgba(190, 212, 234, 0.65);
    transition: all 240ms ease;
  }

  .theme-warm .vf-chap {
    background: rgba(255, 253, 249, 0.75);
    border: 1.5px solid rgba(44, 62, 80, 0.28);
  }

  .vf-chap.active {
    background: var(--v-primary);
    color: #ffffff;
    border-color: var(--v-primary);
    box-shadow: 0 6px 14px rgba(26, 120, 230, 0.25);
  }

  .theme-warm .vf-chap.active {
    background: #d95a30;
    border-color: #2c3e50;
    box-shadow: 0 4px 10px rgba(217, 90, 48, 0.22);
  }

  .vf-chap.done {
    background: var(--v-primary-soft);
    color: var(--v-primary-deep);
    border-color: transparent;
  }

  /* ===== Zone 2 & 3: Main Body ===== */
  .vf-body {
    position: relative;
    z-index: 4;
    flex: 1;
    padding: 12px 36px 8px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    min-height: 0;
  }

  /* Left Presenter Column */
  .vf-left {
    width: 296px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
  }

  .video-frame.presenter-none .vf-left {
    display: none;
  }

  /* Cover slide in no-avatar mode still shows Pharmacist Name Card on left! */
  .video-frame.presenter-none.slide-cover .vf-left {
    display: flex;
    width: 340px;
  }

  .left-pill {
    width: 100%;
    background: var(--v-card-bg);
    border: 1.5px solid var(--v-card-border);
    border-radius: 16px;
    padding: 14px 20px;
    text-align: center;
    box-shadow: var(--v-card-shadow);
  }

  .left-pill-main {
    font-size: 26px;
    font-weight: 800;
    color: var(--v-primary-deep);
    letter-spacing: -0.01em;
    display: inline-block;
    position: relative;
  }

  .left-pill-underline {
    display: block;
    margin: 4px auto 0;
  }

  .left-pill-sub {
    font-size: 19px;
    font-weight: 700;
    color: var(--v-ink);
    line-height: 1.35;
  }

  /* Avatar Ring Container */
  .avatar-stage {
    position: relative;
    width: 256px;
    height: 256px;
    display: grid;
    place-items: center;
  }

  .avatar-ring {
    width: 242px;
    height: 242px;
    border-radius: 50%;
    padding: 7px;
    background: var(--v-ring-outer);
    box-shadow: 0 14px 30px rgba(24, 54, 92, 0.16);
    position: relative;
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #e6f1fc;
    border: 4px solid var(--v-ring-inner);
    position: relative;
  }

  .avatar-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .avatar-sparks {
    position: absolute;
    right: -12px;
    top: 46px;
    pointer-events: none;
  }

  .avatar-badge {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--v-ink);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 99px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 14px rgba(15, 36, 66, 0.22);
    border: 2px solid #ffffff;
  }

  .theme-warm .avatar-badge {
    background: #679c4c;
    border-color: #2c3e50;
  }

  /* Animated speech wave bars */
  .wave-bars {
    display: inline-flex;
    align-items: center;
    gap: 2.5px;
    height: 12px;
  }
  .wave-bars i {
    display: block;
    width: 2.5px;
    background: #77d4ff;
    border-radius: 2px;
    height: 5px;
    animation: wavePulse 1.1s ease-in-out infinite;
  }
  .theme-warm .wave-bars i {
    background: #fff3d6;
  }
  .wave-bars i:nth-child(2) { height: 11px; animation-delay: 0.18s; }
  .wave-bars i:nth-child(3) { height: 7px; animation-delay: 0.36s; }
  .wave-bars i:nth-child(4) { height: 10px; animation-delay: 0.54s; }

  @keyframes wavePulse {
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(1.05); }
  }

  /* Warm Theme Tilted Pharmacist Card (used in Cover or No-Avatar mode) */
  .pharmacist-card {
    width: 100%;
    background: var(--v-card-bg);
    border: 1.5px solid var(--v-card-border);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: var(--v-card-shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .theme-warm .pharmacist-card {
    transform: rotate(-1.2deg);
    border-radius: 10px;
  }

  .tape-strip {
    display: none;
  }

  .theme-warm .tape-strip {
    display: block;
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%) rotate(-1.5deg);
    width: 84px;
    height: 22px;
    background: rgba(235, 175, 130, 0.72);
    border-radius: 2px;
  }

  .pharm-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .pharm-mini-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #e2effc;
    border: 2px solid var(--v-card-border);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: var(--v-primary);
  }

  .pharm-name {
    font-size: 24px;
    font-weight: 800;
    color: var(--v-ink);
  }

  .pharm-hosp {
    font-size: 15px;
    font-weight: 600;
    color: var(--v-ink-soft);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pharm-role {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 6px;
    background: var(--v-green);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
  }

  .pharm-tags {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--v-card-border);
  }

  .pharm-tag-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--v-ink-soft);
  }

  /* ===== Zone 3: Main Infographic Card ===== */
  .main-card {
    flex: 1;
    background: var(--v-card-bg);
    border: 1.5px solid var(--v-card-border);
    border-radius: var(--v-card-radius);
    box-shadow: var(--v-card-shadow);
    padding: 26px 32px 24px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .card-fig-badge {
    position: absolute;
    top: 16px;
    right: 22px;
    font-size: 13px;
    font-weight: 800;
    color: var(--v-primary-deep);
    background: var(--v-primary-soft);
    padding: 4px 12px;
    border-radius: 99px;
  }

  .card-headline {
    font-size: 31px;
    font-weight: 800;
    line-height: 1.26;
    color: var(--v-ink);
    letter-spacing: -0.015em;
    padding-right: 76px;
  }

  .card-headline .hl-coral {
    color: var(--v-coral);
  }

  .card-headline .hl-blue {
    color: var(--v-primary);
  }

  /* Slide 1: Cover Hero Layout */
  .cover-layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: center;
    margin-top: 8px;
  }

  .cover-title-big {
    font-size: 42px;
    font-weight: 900;
    line-height: 1.22;
    color: var(--v-ink);
    letter-spacing: -0.02em;
  }

  .cover-title-big span {
    color: var(--v-coral);
  }

  .cover-lead {
    margin-top: 14px;
    font-size: 19px;
    font-weight: 600;
    color: var(--v-ink-soft);
    line-height: 1.5;
  }

  .cover-pills {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .cover-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 10px;
    background: #f5f9fe;
    border: 1.5px solid #cde1f6;
    font-size: 15px;
    font-weight: 700;
    color: var(--v-ink);
  }

  .theme-warm .cover-pill {
    background: #fffdf9;
    border-color: #2c3e50;
  }

  .cover-art-box {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    max-height: 360px;
    border-radius: 18px;
    background: #ffffff;

    btnAutoplay.classList.toggle("active", state.autoplay);
    btnAutoplay.innerHTML = state.autoplay
      ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>暂停连播`
      : `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>连播演示`;
  }

  function renderAll(animate = false) {
    const isSingle = state.view === "single";
    singleView.classList.toggle("hidden", !isSingle);
    overviewGrid.classList.toggle("visible", !isSingle);

    if (isSingle) {
      stageScaler.innerHTML = renderFrameHTML(SLIDES[state.slideIndex], animate);
      renderFilmstrip();
    } else {
      renderOverview();
    }
    requestAnimationFrame(fitScalers);
  }

  // Bind top bar controls
  document.querySelectorAll("[data-theme]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.theme = btn.dataset.theme;
      syncButtons();
      renderAll(false);
    });
  });

  document.querySelectorAll("[data-presenter]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.presenter = btn.dataset.presenter;
      syncButtons();
      renderAll(false);
    });
  });

  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.view = btn.dataset.view;
      if (state.view === "overview" && state.autoplay) toggleAutoplay();
      syncButtons();
      renderAll(false);
    });
  });

  btnAnno.addEventListener("click", () => {
    state.showAnno = !state.showAnno;
    syncButtons();
    renderAll(false);
  });

  function toggleAutoplay() {
    state.autoplay = !state.autoplay;
    if (state.autoplay) {
      state.view = "single";
      autoplayTimer = setInterval(() => {
        state.slideIndex = (state.slideIndex + 1) % SLIDES.length;
        renderAll(true);
      }, 3200);
    } else {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
    syncButtons();
    renderAll(false);
  }

  btnAutoplay.addEventListener("click", toggleAutoplay);

  // Keyboard shortcuts for smooth presentation
  window.addEventListener("keydown", e => {
    if (state.view !== "single") return;
    if (e.key === "ArrowRight") {
      state.slideIndex = (state.slideIndex + 1) % SLIDES.length;
      renderAll(true);
    } else if (e.key === "ArrowLeft") {
      state.slideIndex = (state.slideIndex - 1 + SLIDES.length) % SLIDES.length;
      renderAll(true);
    }
  });

  new ResizeObserver(fitScalers).observe(document.body);
  window.addEventListener("resize", fitScalers);

  syncButtons();
  renderAll(false);
})();
</script>
</body>
</html>
