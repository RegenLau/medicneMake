<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>信息图模板 · 动态代码动效</title>
  <link rel="stylesheet" href="./template-renderer.css">
  <link rel="stylesheet" href="./assets/library/fonts/studio-fonts.css">
  <style>
    .cm-library-font .pt-frame {
      font-family: "Studio Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .cm-library-art { display: block; width: 100%; height: 100%; object-fit: contain; }
    html, body { margin: 0; overflow: hidden; }
    #motion-frame { width: 1280px; height: 720px; transform-origin: top left; }

    /* Dynamic content-adaptive code-motion stage inside 960x540 .pt-media-slot */
    .cm-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--v-card-bg);
      color: var(--v-ink);
      --cm-accent: var(--v-primary);
      --cm-accent-deep: var(--v-primary-deep);
      --cm-accent-soft: var(--v-primary-soft);
    }

    .cm-stage.tone-warm {
      --cm-accent: var(--v-amber);
      --cm-accent-deep: #9c5609;
      --cm-accent-soft: var(--v-amber-soft);
    }

    .cm-stage.tone-caution {
      --cm-accent: var(--v-coral);
      --cm-accent-deep: #a9280e;
      --cm-accent-soft: var(--v-coral-soft);
    }

    .cm-stage.tone-safe {
      --cm-accent: var(--v-green);
      --cm-accent-deep: #146c43;
      --cm-accent-soft: var(--v-green-soft);
    }

    .cm-scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 32px 20px;
      gap: 14px;
      overflow: hidden;
    }

    .cm-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 44px;
    }

    .cm-header.is-left {
      justify-content: flex-start;
    }

    .cm-heading {
      font-size: 31px;
      font-weight: 850;
      line-height: 1.22;
      letter-spacing: -0.015em;
      color: var(--v-ink);
      text-align: center;
      text-wrap: balance;
    }

    .cm-header.is-left .cm-heading {
      text-align: left;
    }

    .cm-inline-motif {
      width: 48px;
      height: 48px;
      flex: none;
      border-radius: 13px;
      background: var(--cm-accent-soft);
      border: 1.5px solid var(--v-card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cm-inline-motif svg {
      width: 38px;
      height: 38px;
      display: block;
    }

    .cm-body {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .cm-takeaway {
      flex: none;
      width: 100%;
      padding: 12px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--v-card-border);
      background: var(--cm-accent-soft);
      color: var(--cm-accent-deep);
      text-align: center;
      font-size: 19px;
      font-weight: 760;
      line-height: 1.32;
    }

    .cm-stage.tone-caution .cm-takeaway,
    .cm-scene.visual-warning .cm-takeaway {
      background: var(--v-coral);
      border-color: var(--v-coral);
      color: #ffffff;
    }

    .cm-tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 13.5px;
      font-weight: 800;
      background: var(--cm-accent-soft);
      color: var(--cm-accent-deep);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Shared interactive card elevation & spotlight state */
    .cm-item {
      position: relative;
      border-radius: 16px;
      border: 1.5px solid var(--v-card-border);
      background: #f5faff;
      box-shadow: 0 6px 16px rgba(18, 45, 76, 0.05);
      overflow: hidden;
    }

    .theme-warm .cm-item {
      background: #fdf8ef;
      border-color: rgba(44, 62, 80, 0.45);
    }

    .cm-item.is-active {
      border-color: var(--cm-accent);
      box-shadow: 0 10px 24px rgba(18, 45, 76, 0.13);
    }

    .cm-item-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--cm-accent);
      transform-origin: left center;
      transform: scaleX(0);
    }

    /* ===== 1. HOOK (破题直答) ===== */
    .cm-hook-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      height: 100%;
      padding: 4px 8px;
    }

    .cm-hook-wrap.no-motif {
      flex-direction: column;
      gap: 18px;
    }

    .cm-hook-motif-box {
      width: 248px;
      height: 248px;
      flex: none;
      border-radius: 24px;
      background: var(--cm-accent-soft);
      border: 1.5px solid var(--v-card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cm-hook-motif-box svg {
      width: 224px;
      height: 224px;
      display: block;
    }

    .cm-hook-copy {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .cm-hook-wrap.no-motif .cm-hook-copy {
      align-items: center;
      text-align: center;
      max-width: 820px;
    }

    .cm-hook-question {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: -0.02em;
      color: var(--v-ink);
      text-wrap: balance;
    }

    .cm-hook-answer {
      padding: 18px 22px;
      border-radius: 16px;
      background: var(--v-card-bg);
      border: 2px solid var(--cm-accent);
      box-shadow: 0 10px 24px rgba(18, 45, 76, 0.08);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.38;
      color: var(--v-ink);
    }

    .cm-hook-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .cm-hook-wrap.no-motif .cm-hook-pills {
      justify-content: center;
    }

    .cm-hook-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      border-radius: 12px;
      background: var(--cm-accent-soft);
      border: 1.5px solid var(--v-card-border);
      font-size: 16px;
      font-weight: 760;
      color: var(--v-ink);
    }

    .cm-hook-pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cm-accent);
      flex: none;
    }

    /* ===== 2. MECHANISM (原理解析) ===== */
    .cm-mech-split {
      display: grid;
      grid-template-columns: 236px 52px 1fr;
      align-items: center;
      height: 100%;
      gap: 0;
    }

    .cm-mech-motif {
      height: 270px;
      border-radius: 22px;
      background: var(--cm-accent-soft);
      border: 1.5px solid var(--v-card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cm-mech-motif svg {
      width: 214px;
      height: 214px;
      display: block;
    }

    .cm-mech-links {
      width: 52px;
      height: 270px;
      display: block;
      overflow: visible;
    }

    .cm-mech-stack {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      min-width: 0;
    }

    .cm-mech-grid {
      display: grid;
      gap: 14px;
      align-content: center;
      height: 100%;
    }

    .cm-mech-grid.count-1 { grid-template-columns: 1fr; max-width: 760px; margin: 0 auto; width: 100%; }
    .cm-mech-grid.count-2 { grid-template-columns: 1fr 1fr; }
    .cm-mech-grid.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cm-mech-grid.count-4 { grid-template-columns: 1fr 1fr; }

    .cm-mech-card {
      padding: 15px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cm-mech-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cm-mech-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .cm-mech-index {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--cm-accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 850;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .cm-mech-card h3 {
      font-size: 20px;
      font-weight: 820;
      color: var(--v-ink);
      line-height: 1.28;
    }

    .cm-mech-card p {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.44;
      color: var(--v-ink-soft);
      padding-left: 38px;
    }

    .cm-mech-grid.count-3 .cm-mech-card p {
      padding-left: 0;
      margin-top: 4px;
    }

    /* ===== 3. COMPARE (对比辨析) ===== */
    .cm-compare-wrap {
      position: relative;
      display: grid;
      gap: 20px;
      width: 100%;
      max-height: 316px;
      align-items: stretch;
    }

    .cm-compare-wrap.count-2 { grid-template-columns: 1fr 1fr; gap: 28px; }
    .cm-compare-wrap.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    .cm-compare-divider {
      position: absolute;
      top: 8%;
      bottom: 8%;
      left: 50%;
      width: 2px;
      margin-left: -1px;
      background: var(--v-card-border);
      transform-origin: top center;
      pointer-events: none;
    }

    .cm-compare-col {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      border-radius: 18px;
      min-height: 228px;
    }

    .cm-compare-col.col-0 {
      background: linear-gradient(180deg, #ecf6ff 0%, #f8fbff 100%);
      border-color: #c8e0f8;
      --col-accent: var(--v-primary);
    }

    .cm-compare-col.col-1 {
      background: linear-gradient(180deg, #fff5e8 0%, #fffbf5 100%);
      border-color: #f3d4aa;
      --col-accent: var(--v-amber);
    }

    .cm-compare-col.col-2 {
      background: linear-gradient(180deg, #eaf8f1 0%, #f7fdf9 100%);
      border-color: #bee5cf;
      --col-accent: var(--v-green);
    }

    .cm-stage.tone-caution .cm-compare-col.col-1 {
      background: linear-gradient(180deg, #fff1ec 0%, #fffaf8 100%);
      border-color: #f4c6b8;
      --col-accent: var(--v-coral);
    }

    .theme-warm .cm-compare-col.col-0 {
      background: #eef6e8;
      border-color: rgba(44, 62, 80, 0.45);
      --col-accent: var(--v-green);
    }

    .theme-warm .cm-compare-col.col-1 {
      background: #fef4df;
      border-color: rgba(44, 62, 80, 0.45);
      --col-accent: var(--v-coral);
    }

    .theme-warm .cm-compare-col.col-2 {
      background: #f2f5fb;
      border-color: rgba(44, 62, 80, 0.45);
      --col-accent: #3b6f9c;
    }

    .cm-compare-col .cm-item-accent-bar { background: var(--col-accent); }
    .cm-compare-col.is-active { border-color: var(--col-accent); }

    .cm-compare-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cm-compare-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 15px;
      border-radius: 99px;
      background: var(--col-accent);
      color: #ffffff;
      font-size: 19px;
      font-weight: 820;
    }

    .cm-compare-wrap.count-3 .cm-compare-chip {
      font-size: 17px;
      padding: 5px 12px;
    }

    .cm-compare-badge {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--v-ink);
      font-size: 13.5px;
      font-weight: 780;
    }

    .cm-compare-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 2px;
    }

    .cm-compare-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 18.5px;
      font-weight: 660;
      line-height: 1.46;
      color: var(--v-ink);
    }

    .cm-compare-wrap.count-3 .cm-compare-list li {
      font-size: 15px;
    }

    .cm-compare-list svg {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      flex: none;
      color: var(--col-accent);
    }

    .cm-compare-single {
      font-size: 18.5px;
      font-weight: 660;
      line-height: 1.5;
      color: var(--v-ink);
      margin-top: 4px;
    }

    /* ===== 4. STEPS (实操步骤) ===== */
    .cm-steps-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      height: 100%;
    }

    .cm-steps-track {
      position: relative;
      height: 46px;
      width: 100%;
      flex: none;
    }

    .cm-steps-track svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .cm-steps-cards {
      display: grid;
      gap: 14px;
      max-height: 264px;
      min-height: 212px;
      align-items: stretch;
    }

    .cm-steps-cards.count-2 { grid-template-columns: 1fr 1fr; gap: 22px; }
    .cm-steps-cards.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cm-steps-cards.count-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }

    .cm-step-card {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cm-step-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cm-step-num {
      padding: 3px 11px;
      border-radius: 8px;
      background: var(--cm-accent);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 850;
    }

    .cm-step-card h3 {
      font-size: 20px;
      font-weight: 820;
      color: var(--v-ink);
      line-height: 1.28;
    }

    .cm-steps-cards.count-4 .cm-step-card h3 { font-size: 18px; }

    .cm-step-card p {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.46;
      color: var(--v-ink-soft);
    }

    .cm-steps-cards.count-4 .cm-step-card p { font-size: 14px; }

    .cm-step-tag {
      margin-top: auto;
      padding: 7px 10px;
      border-radius: 9px;
      background: var(--v-card-bg);
      border: 1px solid var(--v-card-border);
      font-size: 13.5px;
      font-weight: 780;
      color: var(--cm-accent-deep);
    }

    /* ===== 5. TIMELINE (时间决策) ===== */
    .cm-timeline-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      height: 100%;
    }

    .cm-timeline-tags {
      display: grid;
      gap: 14px;
      text-align: center;
    }

    .cm-timeline-tags.count-2,
    .cm-timeline-cards.count-2 { grid-template-columns: 1fr 1fr; gap: 22px; }
    .cm-timeline-tags.count-3,
    .cm-timeline-cards.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cm-timeline-tags.count-4,
    .cm-timeline-cards.count-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }

    .cm-time-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 6px 16px;
      border-radius: 99px;
      background: var(--cm-accent);
      color: #ffffff;
      font-size: 15px;
      font-weight: 820;
      white-space: nowrap;
    }

    .cm-timeline-axis {
      height: 44px;
      width: 100%;
      flex: none;
    }

    .cm-timeline-axis svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cm-timeline-cards {
      display: grid;
      gap: 14px;
      align-items: stretch;
    }

    .cm-time-card {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: center;
      justify-content: center;
      min-height: 150px;
    }

    .cm-time-card h3 {
      font-size: 21px;
      font-weight: 840;
      color: var(--v-ink);
      line-height: 1.28;
    }

    .cm-timeline-cards.count-4 .cm-time-card h3 { font-size: 18px; }

    .cm-time-card p {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.46;
      color: var(--v-ink-soft);
    }

    .cm-timeline-cards.count-4 .cm-time-card p { font-size: 14px; }

    /* ===== 6. CHECKLIST (核对清单) ===== */
    .cm-check-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      height: 100%;
    }

    .cm-check-motif {
      width: 210px;
      height: 246px;
      flex: none;
      border-radius: 20px;
      background: var(--cm-accent-soft);
      border: 1.5px solid var(--v-card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cm-check-motif svg {
      width: 188px;
      height: 188px;
      display: block;
    }

    .cm-check-card {
      flex: 1 1 0;
      max-width: 780px;
      border-radius: 16px;
      border: 1.5px solid var(--v-card-border);
      background: var(--v-card-bg);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(18, 45, 76, 0.06);
    }

    .cm-check-head {
      padding: 11px 20px;
      background: var(--cm-accent-soft);
      color: var(--cm-accent-deep);
      font-size: 18px;
      font-weight: 800;
      border-bottom: 1.5px solid var(--v-card-border);
    }

    .cm-check-rows {
      display: flex;
      flex-direction: column;
    }

    .cm-check-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 20px;
      border-radius: 0;
      border: 0;
      border-top: 1px solid var(--v-card-border);
      background: var(--v-card-bg);
      box-shadow: none;
    }

    .cm-check-row:first-child { border-top: 0; }
    .cm-check-row.is-active {
      background: var(--cm-accent-soft);
      box-shadow: none;
    }

    .cm-check-box {
      width: 30px;
      height: 30px;
      flex: none;
    }

    .cm-check-text {
      flex: 1 1 0;
      min-width: 0;
    }

    .cm-check-text strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
      color: var(--v-ink);
      line-height: 1.28;
    }

    .cm-check-text span {
      display: block;
      margin-top: 2px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--v-ink-soft);
      line-height: 1.38;
    }

    /* ===== 7. WARNING (风险警示) ===== */
    .cm-warn-grid {
      display: grid;
      gap: 14px;
      align-content: center;
      height: 100%;
    }

    .cm-warn-grid.count-1 { grid-template-columns: 1fr; max-width: 780px; margin: 0 auto; width: 100%; }
    .cm-warn-grid.count-2 { grid-template-columns: 1fr 1fr; gap: 18px; }
    .cm-warn-grid.count-3 { grid-template-columns: 1fr; gap: 11px; }
    .cm-warn-grid.count-4 { grid-template-columns: 1fr 1fr; }

    .cm-warn-card {
      padding: 16px 18px;
      background: #fff7f4;
      border-color: #f4c6b8;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .theme-warm .cm-warn-card {
      background: #fff4ec;
      border-color: rgba(44, 62, 80, 0.45);
    }

    .cm-warn-card .cm-item-accent-bar { background: var(--v-coral); }
    .cm-warn-card.is-active { border-color: var(--v-coral); }

    .cm-warn-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--v-coral-soft);
      color: var(--v-coral);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .cm-warn-body { flex: 1 1 0; min-width: 0; }
    .cm-warn-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cm-warn-card h3 {
      font-size: 19.5px;
      font-weight: 840;
      color: #a9280e;
      line-height: 1.28;
    }

    .cm-warn-grid.count-1 .cm-warn-card { padding: 26px 30px; align-items: center; }
    .cm-warn-grid.count-1 .cm-warn-card h3 { font-size: 25px; }
    .cm-warn-grid.count-1 .cm-warn-card p { font-size: 18px; }

    .cm-warn-card p {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.44;
      color: #553b36;
    }

    /* ===== 8. SUMMARY (收口守护) ===== */
    .cm-summary-hero {
      display: flex;
