<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>科普工作台 · 希息药事</title>
    <link rel="icon" type="image/png" href="/assets/platform-logo.png" />
    <link rel="stylesheet" href="/studio.css" />
    <link rel="stylesheet" href="/template-renderer.css" />
    <link rel="stylesheet" href="/assets/library/fonts/studio-fonts.css" />
    <script src="/video-content.js" defer></script>
    <script src="/template-renderer.js" defer></script>
    <script src="/template-studio.js" defer></script>
    <script src="/svg-motion.js" defer></script>
    <script src="/svg-motion-studio.js" defer></script>
    <script src="/asset-library.js" defer></script>
    <script src="/studio.js" defer></script>
    <script src="/code-motion-studio.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="bar">
        <button type="button" class="brand" data-action="home" aria-label="返回希息药事工作台首页">
          <img class="brandmark" src="/assets/platform-logo.png" width="34" height="34" alt="" />
          <span>希息药事</span>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <span class="workspace">科普工作台</span>
        <div class="grow"></div>
        <button type="button" class="nav-btn" data-action="asset-library" id="nav-library">
          素材库
        </button>
        <button type="button" class="nav-btn" data-action="works" id="nav-works">
          我的作品
        </button>
        <button
          type="button"
          class="env-btn"
          data-action="global-settings"
          id="mode-indicator"
          aria-label="模型配置与 API Key"
          title="模型配置与 API Key"
        >
          模型配置
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
    <div id="notice" role="status" aria-live="polite"></div>
  </body>
</html>
